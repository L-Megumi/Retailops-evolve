[project]
name = "retailops-agent"
version = "0.1.0"
description = "A verifiable agent for retail operations analytics and reporting"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
service = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
test = ["httpx>=0.27,<1"]
harness2 = [
  "harness2 @ git+https://github.com/google-research/harness2.git@62184fe"
]

[project.scripts]
retailops = "retailops_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retailops_agent"]

[tool.hatch.metadata]
allow-direct-references = true

